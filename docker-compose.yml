services:
  internal-software:
    build:
      context: .
      target: internal-software
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - API_PORT=10011
      - NODE_ENV=production
    expose:
      - "10011"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10011/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - flodon-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      internal-software:
        condition: service_healthy
    networks:
      - flodon-network

networks:
  flodon-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
